{{- if .Values.autoscaling.enabled }}

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: {{ include "universal-app.fullname" . }}

spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60 # Menurunkan waktu tunggu dari 300 detik ke 60 detik
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "universal-app.fullname" . }}

  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}

  metrics:

  - type: Resource

    resource:
      name: cpu

      target:
        type: Utilization
        averageUtilization: {{ .Values.autoscaling.targetCPU }}

{{- end }}