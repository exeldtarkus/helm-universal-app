apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "universal-app.fullname" . }}
  labels:
    {{- include "universal-app.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "universal-app.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "universal-app.selectorLabels" . | nindent 8 }}

    spec:

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}

          env:
          {{- range $key,$val := .Values.env }}
            - name: {{ $key }}
              value: "{{ $val }}"
          {{- end }}

          {{- if .Values.healthcheck.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthcheck.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthcheck.periodSeconds }}

          readinessProbe:
            httpGet:
              path: {{ .Values.healthcheck.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthcheck.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          {{- if .Values.storage.enabled }}
          volumeMounts:
            {{- range .Values.storage.mounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- if .subPath }}
              subPath: {{ .subPath }}
              {{- end }}
              {{- if .readOnly }}
              readOnly: true
              {{- end }}
            {{- end }}
          {{- end }}

      {{- if .Values.storage.enabled }}
      volumes:
        {{- range .Values.storage.mounts }}
        - name: {{ .name }}
          {{- if eq .type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ .claimName | default (printf "%s-%s" (include "universal-app.fullname" $) .name) }}
          {{- else if eq .type "nfs" }}
          nfs:
            server: {{ .server }}
            path: {{ .path }}
            {{- if .readOnly }}
            readOnly: true
            {{- end }}
          {{- else if eq .type "hostPath" }}
          hostPath:
            path: {{ .path }}
            type: {{ .hostPathType | default "DirectoryOrCreate" }}
          {{- else if eq .type "emptyDir" }}
          emptyDir: {}
          {{- else }}
          {{- fail (printf "storage.mounts[%s]: type '%s' tidak dikenal (pilih: pvc, nfs, hostPath, emptyDir)" .name .type) }}
          {{- end }}
        {{- end }}
      {{- end }}