replicaCount: 1

image:
  repository: company-repo/company-apps
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: nexus-docker-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  # Anotasi tambahan untuk Service. Digabung paling akhir, jadi menimpa
  # anotasi sticky Traefik yang digenerate otomatis di bawah.
  annotations: {}
  # Sticky session Traefik, dirender jadi anotasi
  # traefik.ingress.kubernetes.io/service.sticky.cookie* di Service
  # (satu-satunya tempat Traefik membaca sticky lewat provider Ingress).
  #   auto  -> ikut anotasi sticky nginx di `ingress.annotations`
  #            (affinity: cookie + session-cookie-name/path/max-age).
  #            Nilainya satu sumber, jadi cutover ke Traefik cuma perlu
  #            flip `ingress.className`, tanpa menyentuh values per release.
  #   true  -> paksa aktif walau anotasi nginx-nya tidak ada
  #   false -> paksa mati
  sticky: auto

routing:
  # Hanya `subdomain` yang didukung sejak v5.0.0; host = <releaseName>.<domain>.
  # Mode `path` dihapus karena bergantung pada path regex + rewrite-target
  # khas ingress-nginx yang tidak jalan di Traefik. Mengisi `path` membuat
  # render gagal dengan pesan jelas, bukan manifest yang salah diam-diam.
  mode: subdomain
  domain: domain.com

tls:
  enabled: true
  secretName: platform-tls

ingress:
  enabled: true
  className: nginx
  annotations:

    nginx.ingress.kubernetes.io/proxy-body-size: "500m"

    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route-default"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"

    # Sisa dari routing.mode "path" yang sudah dihapus. Pada path "/" nilainya
    # no-op (rewrite / -> /), dan Traefik mengabaikannya. Dibiarkan supaya
    # Langkah 4 (redeploy ke v5.0.0 saat masih dilayani ingress-nginx) nol-diff;
    # dibuang di Langkah 8 bareng anotasi nginx lainnya.
    nginx.ingress.kubernetes.io/rewrite-target: /

  # Kode status yang dibalas dengan halaman custom dari default backend
  # ingress-nginx (svc ingress-nginx/custom-404), mis. 503 = halaman
  # "Sedang deploy" saat aplikasi belum punya pod Ready.
  # Dirender jadi anotasi nginx.ingress.kubernetes.io/custom-http-errors.
  # Format: "503" atau "404,503" (lewat --set, escape komanya: "404\,503").
  # Isi "" untuk mematikan, mis. API yang sengaja membalas 503 berisi JSON.
  # Kalau anotasi custom-http-errors sudah ada di `annotations`, yang itu dipakai.
  customHttpErrors: "503"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPU: 95

healthcheck:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

env: {}

# Storage / share folder.
# Dimatikan secara default supaya service yang tidak butuh disk tetap ephemeral.
# Setiap entry di `mounts` menghasilkan satu volume + volumeMount di container.
#
# type yang didukung:
#   pvc       -> pakai PersistentVolumeClaim. Chart yang membuat PVC-nya,
#                kecuali `claimName` diisi (berarti pakai PVC yang sudah ada).
#   nfs       -> mount langsung ke NFS server (butuh `server` + `path`)
#   hostPath  -> mount folder dari node (hanya untuk single-node / k3s lokal)
#   emptyDir  -> scratch space, hilang saat pod mati
#
# Catatan share folder Windows (UNC \\server\share):
#   Kubernetes tidak bisa mount UNC langsung. Pilih salah satu:
#   1. Pasang csi-driver-smb di cluster, buat StorageClass SMB + secret kredensial,
#      lalu pakai type: pvc dengan storageClass tersebut.
#   2. Expose share tersebut sebagai NFS, lalu pakai type: nfs.
#   Setelah ter-mount, arahkan env aplikasi ke mountPath-nya
#   (mis. ASSETS_FONTS_PATH, LINUX_SHARE_FOLDER_BASE).
storage:
  enabled: false
  mounts: []
    # - name: reports
    #   type: pvc
    #   mountPath: /app/reports
    #   size: 10Gi
    #   accessModes:
    #     - ReadWriteMany   # WAJIB RWX kalau replica > 1 atau HPA aktif
    #   storageClass: ""    # kosong = pakai default StorageClass cluster
    #   claimName: ""       # diisi = pakai PVC existing, chart tidak bikin baru
    #   subPath: ""
    #   readOnly: false
    #
    # - name: assets
    #   type: nfs
    #   mountPath: /mnt/assets
    #   server: 10.0.0.10
    #   path: /Company-share/Operations-IT/Assets
    #   readOnly: true

resources:
  requests:
    cpu: 500m      # Jaminan alokasi setengah Core saat aplikasi idle
    memory: 1024Mi # Jaminan memori dasar agar JVM tidak kesulitan saat startup
  limits:
    cpu: 1000m     # Mengizinkan pemakaian 1 Core penuh untuk mempercepat booting
    memory: 2048Mi # Batas aman 2 GB untuk menampung spike memori Spring dan HikariCP