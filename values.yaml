replicaCount: 1

image:
  repository: company-repo/company-apps
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: nexus-docker-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

routing:
  mode: path
  domain: domain.com

tls:
  enabled: true
  secretName: platform-tls

ingress:
  enabled: true
  className: nginx
  annotations:

    nginx.ingress.kubernetes.io/proxy-body-size: "500m"

    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route-default"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"

    nginx.ingress.kubernetes.io/rewrite-target: /

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPU: 95

healthcheck:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

canary:
  enabled: false
  weight: 20

env: {}

resources:
  requests:
    cpu: 500m      # Jaminan alokasi setengah Core saat aplikasi idle
    memory: 1024Mi # Jaminan memori dasar agar JVM tidak kesulitan saat startup
  limits:
    cpu: 1000m     # Mengizinkan pemakaian 1 Core penuh untuk mempercepat booting
    memory: 2048Mi # Batas aman 2 GB untuk menampung spike memori Spring dan HikariCP