replicaCount: 1

image:
  repository: company-repo/company-apps
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: nexus-docker-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

routing:
  mode: path
  domain: domain.com
  # Opsional. Kalau diisi, dipakai literal sebagai host (mode subdomain) —
  # menimpa default "<releaseName>.<domain>". Berguna kalau segmen host yang
  # diinginkan tidak boleh/tidak sama dengan nama release (mis. release name
  # harus DNS-1123 valid/tanpa underscore, tapi host publik boleh underscore).
  host: ""

tls:
  enabled: true
  secretName: platform-tls

ingress:
  enabled: true
  className: nginx
  annotations:

    nginx.ingress.kubernetes.io/proxy-body-size: "500m"

    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route-default"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"

    nginx.ingress.kubernetes.io/rewrite-target: /

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPU: 95

healthcheck:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

canary:
  enabled: false
  weight: 20

env: {}

# Storage / share folder.
# Dimatikan secara default supaya service yang tidak butuh disk tetap ephemeral.
# Setiap entry di `mounts` menghasilkan satu volume + volumeMount di container.
#
# type yang didukung:
#   pvc       -> pakai PersistentVolumeClaim. Chart yang membuat PVC-nya,
#                kecuali `claimName` diisi (berarti pakai PVC yang sudah ada).
#   nfs       -> mount langsung ke NFS server (butuh `server` + `path`)
#   hostPath  -> mount folder dari node (hanya untuk single-node / k3s lokal)
#   emptyDir  -> scratch space, hilang saat pod mati
#
# Catatan share folder Windows (UNC \\server\share):
#   Kubernetes tidak bisa mount UNC langsung. Pilih salah satu:
#   1. Pasang csi-driver-smb di cluster, buat StorageClass SMB + secret kredensial,
#      lalu pakai type: pvc dengan storageClass tersebut.
#   2. Expose share tersebut sebagai NFS, lalu pakai type: nfs.
#   Setelah ter-mount, arahkan env aplikasi ke mountPath-nya
#   (mis. ASSETS_FONTS_PATH, LINUX_SHARE_FOLDER_BASE).
storage:
  enabled: false
  mounts: []
    # - name: reports
    #   type: pvc
    #   mountPath: /app/reports
    #   size: 10Gi
    #   accessModes:
    #     - ReadWriteMany   # WAJIB RWX kalau replica > 1 atau HPA aktif
    #   storageClass: ""    # kosong = pakai default StorageClass cluster
    #   claimName: ""       # diisi = pakai PVC existing, chart tidak bikin baru
    #   subPath: ""
    #   readOnly: false
    #
    # - name: assets
    #   type: nfs
    #   mountPath: /mnt/assets
    #   server: 10.0.0.10
    #   path: /Company-share/Operations-IT/Assets
    #   readOnly: true

resources:
  requests:
    cpu: 500m      # Jaminan alokasi setengah Core saat aplikasi idle
    memory: 1024Mi # Jaminan memori dasar agar JVM tidak kesulitan saat startup
  limits:
    cpu: 1000m     # Mengizinkan pemakaian 1 Core penuh untuk mempercepat booting
    memory: 2048Mi # Batas aman 2 GB untuk menampung spike memori Spring dan HikariCP